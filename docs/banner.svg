<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="600" height="180" fill="#0a0e14"/>
  <ellipse cx="300" cy="90" rx="280" ry="80" fill="url(#glow)"/>

  <!-- Left Gabor -->
  <g transform="translate(100, 90)" opacity="0.4">
    <clipPath id="clip-l"><circle r="38"/></clipPath>
    <g clip-path="url(#clip-l)">
      <g filter="url(#blur)">
        <rect x="-40" y="-40" width="80" height="80" fill="#808080"/>
        <rect x="-40" y="-40" width="80" height="80" fill="none" stroke="#00e5ff" stroke-width="0.5" opacity="0.3"/>
        <!-- Stripes at 0° -->
        <line x1="-40" y1="-20" x2="40" y2="-20" stroke="#00e5ff" stroke-width="3" opacity="0.5"/>
        <line x1="-40" y1="-10" x2="40" y2="-10" stroke="#0a0e14" stroke-width="3" opacity="0.5"/>
        <line x1="-40" y1="0" x2="40" y2="0" stroke="#00e5ff" stroke-width="3" opacity="0.5"/>
        <line x1="-40" y1="10" x2="40" y2="10" stroke="#0a0e14" stroke-width="3" opacity="0.5"/>
        <line x1="-40" y1="20" x2="40" y2="20" stroke="#00e5ff" stroke-width="3" opacity="0.5"/>
      </g>
    </g>
  </g>

  <!-- Right Gabor -->
  <g transform="translate(500, 90)" opacity="0.4">
    <clipPath id="clip-r"><circle r="38"/></clipPath>
    <g clip-path="url(#clip-r)">
      <g filter="url(#blur)">
        <rect x="-40" y="-40" width="80" height="80" fill="#808080"/>
        <rect x="-40" y="-40" width="80" height="80" fill="none" stroke="#00e5ff" stroke-width="0.5" opacity="0.3"/>
        <!-- Stripes at 90° -->
        <line x1="-20" y1="-40" x2="-20" y2="40" stroke="#00e5ff" stroke-width="3" opacity="0.5"/>
        <line x1="-10" y1="-40" x2="-10" y2="40" stroke="#0a0e14" stroke-width="3" opacity="0.5"/>
        <line x1="0" y1="-40" x2="0" y2="40" stroke="#00e5ff" stroke-width="3" opacity="0.5"/>
        <line x1="10" y1="-40" x2="10" y2="40" stroke="#0a0e14" stroke-width="3" opacity="0.5"/>
        <line x1="20" y1="-40" x2="20" y2="40" stroke="#00e5ff" stroke-width="3" opacity="0.5"/>
      </g>
    </g>
  </g>

  <!-- Title -->
  <text x="300" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#00e5ff" letter-spacing="-0.02em">
    Distractor Lab
  </text>
  <text x="300" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#5a6a7a" letter-spacing="0.05em">
    VISUAL PERCEPTION TRAINER
  </text>
</svg>
